databases:
  - name: majustelservice-db
    plan: free

services:
  - type: web
    name: majustelservice-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Distance Matrix key for shipping fees. Must be a SERVER key: a browser
      # key restricted to HTTP referrers is refused with REQUEST_DENIED here.
      - key: GOOGLE_MAPS_SERVER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: majustelservice-db
          property: connectionString
